[profile.default]
src = "contracts"
test = "test/contracts"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
optimizer = true
# Favor deployable runtime size. RoundManagerV4 is intentionally feature-rich;
# 200 runs leaves more than 2 KB below EIP-170 while retaining the optimizer.
optimizer_runs = 200
via_ir = true

[fmt]
line_length = 88
tab_width = 4
bracket_spacing = true

[fuzz]
runs = 512

[invariant]
runs = 256
depth = 32

[profile.v4-torture.invariant]
runs = 200
depth = 500
fail_on_revert = false

[profile.v4-torture.fuzz]
runs = 4096

[rpc_endpoints]
local = "http://127.0.0.1:8545"
robinhood_testnet = "${ROBINHOOD_TESTNET_RPC_URL}"
